<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Unplatform AI</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #0b0d0c;
        --muted: #7d877f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--ink);
        color: #eef2ed;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .app-icon {
        display: block;
        width: 72px;
        height: 72px;
      }
      .copy {
        display: grid;
        gap: 3px;
      }
      .name {
        font-size: 15px;
        font-weight: 600;
      }
      .status {
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="app-icon" src="app-icon.png" alt="" width="72" height="72" />
      <div class="copy">
        <div class="name">Unplatform AI</div>
        <div class="status">Starting...</div>
      </div>
    </main>
  </body>
</html>
