name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Sidecar placeholder
        run: |
          # tauri-build copies every bundle path from tauri.conf.json, so the CI
          # checkout needs the sidecar and resource paths to exist.
          target=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries src-tauri/resources/licenses src-tauri/resources/server-archive
          touch src-tauri/binaries/unplatform-ai-server-"$target" src-tauri/binaries/ffmpeg-"$target"
          chmod +x src-tauri/binaries/unplatform-ai-server-"$target" src-tauri/binaries/ffmpeg-"$target"
          touch src-tauri/resources/THIRD_PARTY_NOTICES.md src-tauri/resources/LICENSE
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav \
            build-essential nasm pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - uses: ./.github/actions/setup-pnpm
      - name: Cache ffmpeg downloads and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/unplatform-ai-build/ffmpeg
          key: ffmpeg-x86_64-unknown-linux-gnu-${{ hashFiles('scripts/ffmpeg/**') }}
      - run: pnpm ffmpeg:build
      - name: Use the built ffmpeg
        shell: bash
        run: |
          binary=$(find "$HOME/.cache/unplatform-ai-build/ffmpeg" -type f -name 'ffmpeg-x86_64-unknown-linux-gnu' -print -quit)
          test -n "$binary"
          echo "FFMPEG_BINARY=$binary" >> "$GITHUB_ENV"
          echo "ALLOW_OFFICIAL_NODE=1" >> "$GITHUB_ENV"
      - run: pnpm desktop:prepare
      - name: Prepared runtime requires
        run: pnpm check:standalone -- src-tauri/resources/server
      - run: pnpm smoke
      - name: Build the desktop shell without a bundle
        env:
          UPAI_PREPARED: 1
        run: pnpm tauri build --no-bundle

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm deps
      - run: pnpm format:check
      - run: pnpm knip
      - name: Notices
        if: github.actor != 'dependabot[bot]' || github.base_ref != 'releases'
        run: pnpm notices --check
      - run: pnpm test
      - run: pnpm build
      - name: Old names
        run: pnpm check:names
      - name: Standalone requires
        run: pnpm check:standalone

  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Sidecar placeholder
        shell: bash
        run: |
          # tauri-build copies every bundle path from tauri.conf.json, so the CI
          # checkout needs the sidecar and resource paths to exist.
          target=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries src-tauri/resources/licenses src-tauri/resources/server-archive
          touch src-tauri/binaries/unplatform-ai-server-"$target".exe src-tauri/binaries/ffmpeg-"$target".exe
          touch src-tauri/resources/THIRD_PARTY_NOTICES.md src-tauri/resources/LICENSE
      - run: pnpm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    if: github.actor != 'dependabot[bot]' || github.base_ref != 'releases'
    name: e2e (${{ matrix.width }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        width: [1280, 1728, 2560]
    env:
      # Tracks the Chrome major shipped by the ubuntu-24.04 runner image.
      E2E_CHROME_MAJOR: '156'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Use the ffmpeg-static binary
        run: |
          FFMPEG_PATH="$(node -p "require('ffmpeg-static')")"
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          chmod +x "$FFMPEG_PATH"
      - name: Resolve Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No Chrome or Chromium binary on PATH" >&2
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          OPENROUTER_MOCK: '1'
          REMOTE_MOCK: '1'
        run: pnpm build
      - name: End-to-end flows
        shell: bash
        env:
          E2E_SKIP_BUILD: '1'
          OPENROUTER_MOCK: '1'
          REMOTE_MOCK: '1'
          CUSTOM_ENDPOINT_MOCK: '1'
          E2E_TMPDIR: ${{ runner.temp }}/e2e-${{ matrix.width }}
        run: node tests/e2e/run.mjs --width=${{ matrix.width }} 2>&1 | tee "${{ runner.temp }}/e2e-${{ matrix.width }}.log"
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.width }}
          path: |
            ${{ runner.temp }}/e2e-${{ matrix.width }}
            ${{ runner.temp }}/e2e-${{ matrix.width }}.log
          if-no-files-found: ignore

  e2e-windows:
    if: github.actor != 'dependabot[bot]' || github.base_ref != 'releases'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      # Tracks the Chrome major shipped by the windows-2025 runner image.
      E2E_CHROME_MAJOR: '156'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - name: Use the ffmpeg-static binary
        shell: pwsh
        run: |
          $ffmpeg = node -p "require('ffmpeg-static')"
          "FFMPEG_PATH=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Use the runner image Chrome
        shell: pwsh
        run: |
          # The windows-2025 image pins Chrome; installing another copy would drift.
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not (Test-Path $chrome)) {
            throw "The runner image has no Chrome at $($candidates -join ', ')"
          }
          "CHROME_PATH=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build
        env:
          OPENROUTER_MOCK: '1'
          REMOTE_MOCK: '1'
        run: pnpm build
      - name: Image first open
        shell: bash
        env:
          E2E_SKIP_BUILD: '1'
          OPENROUTER_MOCK: '1'
          REMOTE_MOCK: '1'
          CUSTOM_ENDPOINT_MOCK: '1'
        run: node tests/e2e/run.mjs --case=image-first
