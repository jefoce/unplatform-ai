name: pr-version
# Pull requests into releases are never merged by this check. A Dependabot PR
# stays open as a reminder with the apply-on-next label and one comment, and is
# applied on the next version branch. Branch protection can optionally require
# the apply-on-next check so an unlabeled Dependabot PR cannot merge.
run-name: >-
  Version check #${{ github.event.number }} ${{ github.event.pull_request.title }}

on:
  pull_request:
    branches: [releases]
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check version
        shell: bash
        env:
          PR_AUTHOR: ${{ github.actor }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.number }}
          TITLE: ${{ github.event.pull_request.title }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/version-check.sh
